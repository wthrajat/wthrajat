
      <svg
        width="467"
        height="140"
        viewBox="0 0 467 140"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-labelledby="descId"
      >
        <title id="titleId">my gh stats, Rank: A+</title>
        <desc id="descId">total commits  : 1070, total prs merged: 2125, total contributions: 5248, contributed to (last year): 49</desc>
        <style>
          .header {
            font: 600 17px 'Segoe UI', Ubuntu, Sans-Serif;
            fill: #2f80ed;
            animation: fadeInAnimation 0.8s ease-in-out forwards;
          }
          @supports(-moz-appearance: auto) {
            /* Selector detects Firefox */
            .header { font-size: 14.5px; }
          }
          
    .stat {
      font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif; fill: #434d58;
      letter-spacing: 0.15px;
    }
    @supports(-moz-appearance: auto) {
      /* Selector detects Firefox */
      .stat { font-size:12px; }
    }
    .stat-value {
      filter: drop-shadow(0 0 6px rgba(96, 165, 250, 0.28));
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    .rank-text {
      font: 800 22px 'Segoe UI', Ubuntu, Sans-Serif; fill: #434d58;
      animation: scaleInAnimation 0.3s ease-in-out forwards;
      filter: drop-shadow(0 0 10px rgba(34, 211, 238, 0.3));
    }
    .rank-percentile-header {
      font-size: 13px;
    }
    .rank-percentile-text {
      font-size: 15px;
    }

    .not_bold { font-weight: 400 }
    .bold { font-weight: 700 }
    .icon {
      fill: #4c71f2;
      display: block;
    }
    [data-icon-for="stars"] {
      filter: drop-shadow(0 0 4px rgba(248, 216, 71, 0.35));
    }
    [data-icon-for="commits"] {
      filter: drop-shadow(0 0 4px rgba(88, 166, 255, 0.4));
    }
    [data-icon-for="prs"] {
      filter: drop-shadow(0 0 4px rgba(191, 145, 243, 0.4));
    }
    [data-icon-for="issues"] {
      filter: drop-shadow(0 0 4px rgba(121, 255, 151, 0.3));
    }
    [data-icon-for="contribs"] {
      filter: drop-shadow(0 0 4px rgba(34, 211, 238, 0.38));
    }
    [data-icon-for="reviews"],
    [data-icon-for="contributions"],
    [data-icon-for="discussions_started"],
    [data-icon-for="discussions_answered"],
    [data-icon-for="prs_merged"],
    [data-icon-for="prs_merged_percentage"] {
      filter: drop-shadow(0 0 4px rgba(96, 165, 250, 0.3));
    }

    .rank-circle-rim {
      stroke: #2f80ed;
      fill: none;
      stroke-width: 5.5;
      opacity: 0.15;
    }
    .rank-circle {
      stroke: url(#rank-gradient);
      stroke-dasharray: 250;
      fill: none;
      stroke-width: 5.5;
      stroke-linecap: round;
      opacity: 0.95;
      transform-origin: -10px 8px;
      transform: rotate(-90deg);
      animation: rankAnimation 1s forwards ease-in-out;
      filter: url(#rank-glow);
    }
    
    @keyframes rankAnimation {
      from {
        stroke-dashoffset: 251.32741228718345;
      }
      to {
        stroke-dashoffset: 46.50177882240914;
      }
    }
  
  

          
      /* Animations */
      @keyframes scaleInAnimation {
        from {
          transform: translate(-5px, 5px) scale(0);
        }
        to {
          transform: translate(-5px, 5px) scale(1);
        }
      }
      @keyframes fadeInAnimation {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    
          
        </style>

        

        
      <defs>
        <clipPath id="card-clip">
          <rect
            x="0.5"
            y="0.5"
            rx="4.5"
            height="99%"
            width="466"
          />
        </clipPath>
        <linearGradient id="card-depth" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.16" />
          <stop offset="45%" stop-color="#1d4ed8" stop-opacity="0.05" />
          <stop offset="75%" stop-color="#1d4ed8" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="card-reflection" x1="0" y1="0" x2="0.7" y2="1">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
          <stop offset="30%" stop-color="#ffffff" stop-opacity="0.09" />
          <stop offset="52%" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="card-streak" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
          <stop offset="50%" stop-color="#dbeafe" stop-opacity="0.09" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>
        <radialGradient id="card-ambient" cx="0.5" cy="0.42" r="0.85">
          <stop offset="0%" stop-color="#3b82f6" stop-opacity="0" />
          <stop offset="72%" stop-color="#3b82f6" stop-opacity="0" />
          <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.12" />
        </radialGradient>
        <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow
            dx="0"
            dy="0"
            stdDeviation="9"
            flood-color="#3b82f6"
            flood-opacity="0.16"
          />
          <feDropShadow
            dx="0"
            dy="3"
            stdDeviation="4"
            flood-color="#000000"
            flood-opacity="0.16"
          />
        </filter>
      </defs>
    

        <rect
          data-testid="card-bg"
          x="0.5"
          y="0.5"
          rx="4.5"
          height="99%"
          stroke="#e4e2e2"
          width="466"
          fill="#fffefe"
          stroke-opacity="1"
          filter="url(#card-shadow)"
        />

        <rect
          data-testid="card-edge-highlight"
          x="1.5"
          y="1.5"
          rx="4.5"
          height="98%"
          width="464"
          fill="none"
          stroke="#ffffff"
          stroke-opacity="0.06"
        />

        
      <g clip-path="url(#card-clip)">
        <rect x="0" y="0" width="467" height="140" fill="url(#card-depth)" />
        <rect
          x="0"
          y="0"
          width="467"
          height="140"
          fill="url(#card-reflection)"
        />
        <g opacity="0.55">
          <polygon
            points="84.1,0 158.8,0 46.7,140 -28.0,140"
            fill="url(#card-streak)"
          />
          <polygon
            points="196.1,0 233.5,0 121.4,140 84.1,140"
            fill="url(#card-streak)"
            opacity="0.7"
          />
        </g>
        <rect x="0" y="0" width="467" height="140" fill="url(#card-ambient)" />
      </g>
    

        

        <g
          data-testid="main-card-body"
          transform="translate(0, 25)"
        >
          
    <defs>
        <linearGradient id="rank-gradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#2f80ed" />
          <stop offset="100%" stop-color="#22d3ee" />
        </linearGradient>
        <radialGradient id="rank-ambient" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0%" stop-color="#3b82f6" stop-opacity="0" />
          <stop offset="62%" stop-color="#3b82f6" stop-opacity="0" />
          <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.14" />
        </radialGradient>
        <filter
          id="rank-glow"
          x="-40%"
          y="-40%"
          width="180%"
          height="180%"
        >
          <feDropShadow
            dx="0"
            dy="0"
            stdDeviation="3.5"
            flood-color="#22d3ee"
            flood-opacity="0.35"
          />
        </filter>
      </defs>
    <g data-testid="rank-circle"
          transform="translate(390.5, 35)">
        <circle cx="-10" cy="8" r="58" fill="url(#rank-ambient)" />
        <circle class="rank-circle-rim" cx="-10" cy="8" r="40" />
        <circle class="rank-circle" cx="-10" cy="8" r="40" />
        <path
          d="M -38 2 A 40 40 0 0 1 -10 -32"
          stroke="#ffffff"
          stroke-opacity="0.32"
          stroke-width="2.5"
          fill="none"
          stroke-linecap="round"
        />
        <g class="rank-text">
          
        <text x="-5" y="3" alignment-baseline="central" dominant-baseline="central" text-anchor="middle" data-testid="level-rank-icon">
          A+
        </text>
      
        </g>
      </g>
