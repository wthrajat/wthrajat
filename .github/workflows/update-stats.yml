name: Update stats snapshots

on:
  schedule:
    - cron: "0 2 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats snapshots
        run: |
          curl -fsSL "https://rajat-grs.vercel.app/api?username=wthrajat&show_icons=true&include_all_commits=true&hide=stars,issues&show=contributions&custom_title=my%20gh%20stats&number_format=long&lowercase=true&theme=holi&cache_seconds=259200&token=${{ secrets.GRS_TOKEN }}" -o assets/stats-dark.svg
          curl -fsSL "https://rajat-grs.vercel.app/api?username=wthrajat&show_icons=true&include_all_commits=true&hide=stars,issues&show=contributions&custom_title=my%20gh%20stats&number_format=long&lowercase=true&theme=default&cache_seconds=259200&token=${{ secrets.GRS_TOKEN }}" -o assets/stats-light.svg

      - name: Verify snapshots
        run: |
          if grep -q "Access denied" assets/stats-dark.svg assets/stats-light.svg; then
            echo "Fetched snapshots contain an access-denied card. Check that the GRS_TOKEN secret matches the Vercel env var." >&2
            exit 1
          fi

      - name: Commit snapshots if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats-dark.svg assets/stats-light.svg
          git diff --cached --quiet || git commit -m "chore(stats): refresh snapshots"
          git push
